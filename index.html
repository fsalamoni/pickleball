<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Aba do navegador: o logo na versão do tema do aparelho (o navegador troca sozinho). -->
    <link rel="icon" type="image/png" sizes="64x64" href="/icones/favicon-escuro-64-v1.png" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" sizes="64x64" href="/icones/favicon-claro-64-v1.png" media="(prefers-color-scheme: light)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="PickleRush — conectando e organizando o pickleball globalmente. Single, duplas e americana, regras CBP/USAP, sorteio automatizado e ranking ao vivo." />
    <meta name="theme-color" content="#0B0F19" />
    <meta name="color-scheme" content="light dark" />
    <meta name="application-name" content="PickleRush" />
    <meta name="generator" content="PickleRush (React 18 + Vite)" />

    <!-- Open Graph / Twitter Card — partilha em redes sociais e apps de mensagem -->
    <meta property="og:site_name" content="PickleRush" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="PickleRush — pickleball no Brasil" />
    <meta property="og:description" content="Single, duplas e americana, regras CBP/USAP, sorteio automatizado e ranking ao vivo. Encontre quadras, jogadores e torneios perto de você." />
    <meta property="og:image" content="https://picklerush.web.app/logo-claro.png" />
    <meta property="og:image:alt" content="Logo PickleRush" />
    <meta property="og:url" content="https://picklerush.web.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PickleRush — pickleball no Brasil" />
    <meta name="twitter:description" content="Single, duplas e americana, regras CBP/USAP, sorteio automatizado e ranking ao vivo." />
    <meta name="twitter:image" content="https://picklerush.web.app/logo-claro.png" />

    <!-- Robôs: default para indexar a landing; páginas autenticadas têm <meta name="robots" content="noindex,nofollow"> -->
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="googlebot" content="index, follow" />

    <!-- Canônico -->
    <link rel="canonical" href="https://picklerush.web.app/" />

    <title>PickleRush</title>

    <!-- PWA: metadados de instalação. O manifesto e o apple-touch-icon apontam
         para o CLARO aqui; src/core/pwa/iconeDoApp.js troca para a versão do
         tema do celular (e a fixa depois de instalado). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Modo escuro: pinta a PRIMEIRA tela na aparência escolhida, antes de o
         aplicativo carregar (sem o clarão branco a cada abertura). Lê só o
         espelho do aparelho, que o aplicativo mantém e apaga quando o escuro
         não pode valer. Ver src/core/theme/themePreference.js. -->
    <script>
      (function () {
        try {
          // Telão, totem e impressão ficam claros sempre (AparenciaClara).
          if (/\/(telao|totem|imprimir)\/?$/.test(window.location.pathname)) return;
          var t = window.localStorage.getItem('picklerush:tema');
          var escuro = t === 'escuro' || (t === 'automatico' && !!window.matchMedia
            && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (!escuro) return;
          document.documentElement.classList.add('dark');
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', '#070B13');
        } catch (e) { /* armazenamento bloqueado: abre no claro */ }
      })();
    </script>
    <link rel="apple-touch-icon" sizes="180x180" href="/icones/apple-claro-180-v1.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "default", não "black-translucent": o translúcido põe relógio e bateria
         BRANCOS por cima do topo, que no tema claro é branco (sumiam). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PickleRush" />

    <!-- V2 (Athleisure Premium) design system fonts — usadas pelo app oficial -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>O PickleRush precisa de JavaScript ativado para funcionar.</noscript>
    <!-- Rede de segurança de ANTES do React: navegador antigo que não entende o
         pacote (erro de sintaxe) ou pacote que não baixou deixam a tela branca.
         Script clássico e em ES5 de propósito, para rodar em qualquer aparelho. -->
    <script>
      (function () {
        var erro = null;
        function vazio() { var r = document.getElementById('root'); return r && !r.hasChildNodes(); }
        // Conta para o monitoramento de erros (functions/clientErrors.js) que a
        // tela não abriu — o único jeito de saber quais aparelhos ficam no branco.
        function relatar() {
          try {
            if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname) || !navigator.sendBeacon) return;
            navigator.sendBeacon('/api/erro', JSON.stringify({
              mensagem: 'A tela não abriu: ' + ((erro && erro.mensagem) || 'passou de 20 s sem o aplicativo'),
              pilha: (erro && erro.pilha) || '',
              fonte: 'index.html',
              fatal: true,
              rota: location.pathname.replace(/\/[A-Za-z0-9_-]{20,}(?=\/|$)/g, '/:id')
            }));
          } catch (e) { /* nunca atrapalha o aviso */ }
        }
        function guardar(e) {
          if (erro || !e) return;
          var alvo = e.target && (e.target.src || e.target.href);
          erro = {
            mensagem: e.message || (e.reason && (e.reason.message || String(e.reason))) || (alvo ? 'não baixou ' + alvo : ''),
            pilha: (e.error && e.error.stack) || (e.reason && e.reason.stack) || ''
          };
        }
        function avisar() {
          if (!vazio()) return;
          relatar();
          var r = document.getElementById('root');
          r.innerHTML = '<div style="font-family:sans-serif;max-width:420px;margin:15vh auto 0;padding:24px;text-align:center">'
            + '<h1 style="font-size:18px;margin:0 0 8px">Não conseguimos abrir o PickleRush</h1>'
            + '<p style="font-size:14px;color:#6b7280;margin:0 0 16px">Verifique a conexão e tente de novo. Se continuar, atualize o navegador ou abra o link no Chrome/Safari (fora do navegador de dentro de outro aplicativo).</p>'
            + '<button onclick="location.reload()" style="font-size:14px;font-weight:600;border:0;border-radius:999px;padding:10px 20px;background:#0B0F19;color:#fff">Tentar de novo</button></div>';
        }
        window.addEventListener('error', function (e) { guardar(e); setTimeout(avisar, 1500); }, true);
        window.addEventListener('unhandledrejection', function (e) { guardar(e); setTimeout(avisar, 1500); });
        setTimeout(avisar, 20000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
