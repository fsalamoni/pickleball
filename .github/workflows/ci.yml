name: CI

on:
  push:
    branches: [main, copilot/**]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancela runs anteriores do MESMO ref quando chega um commit novo. Evita
# pilha de runs concorrentes (o agente empurra vários commits seguidos),
# reduz contenção de recursos e some com "runs zumbis" que ficavam presos.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Rede de segurança: um travamento (npm/test/build) falha rápido em vez de
    # arrastar ~1h. Runs saudáveis levam ~2min, então 20min é folga suficiente.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 8

      - name: Secret scan (arquivos versionados)
        run: npm run security:secrets

      - name: Inventário de documentação em dia com o código
        run: npm run docs:inventario:check

      - name: Lint
        run: npm run lint

      - name: Test (Vitest)
        run: npm test
        timeout-minutes: 10

      - name: Build
        run: npm run build
        timeout-minutes: 6
        env:
          VITE_FIREBASE_API_KEY: dummy
          VITE_FIREBASE_AUTH_DOMAIN: dummy.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: dummy
          VITE_FIREBASE_STORAGE_BUCKET: dummy.appspot.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '0'
          VITE_FIREBASE_APP_ID: '1:0:web:dummy'

      # O pacote inicial (gzip) tem orçamento: ver scripts/check-bundle-size.mjs.
      - name: Orçamento do pacote inicial
        run: npm run build:budget

  # Regras de segurança do Firestore, contra o emulador. Job separado para
  # não pesar o build (precisa de Java e baixa o emulador). É o que impede
  # que uma regressão reabra um achado de segurança já corrigido —
  # ver docs/20-SEGURANCA-E-PRIVACIDADE/01-AUDITORIA-ACHADOS.md.
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      # O emulador do Firestore roda em Java.
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 8

      # As regras são testadas como vão ao ar: compactadas (ver deploy-firebase.yml).
      - name: Compactar regras do Firestore como no deploy
        run: node scripts/firestore-rules-compactar.mjs --escrever
      - name: Test (regras do Firestore no emulador)
        run: npm run test:rules
        timeout-minutes: 10

  # Testes de navegador (Playwright): o build DESTE PR servido localmente, com
  # Auth e Firestore nos emuladores. Entra numa conta de teste e abre as telas
  # principais (no computador e no celular) e passa o axe nas públicas. Pega o
  # que o Vitest não vê: tela que quebra ao montar de verdade, rota que leva ao
  # nada, regra do banco que recusa quem acabou de entrar. Ver docs/03-WORKFLOW.md §10.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      # O emulador do Firestore roda em Java.
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 8

      # As fontes do apt vêm de um espelho que às vezes fica lento (2026-10-22:
      # cinco minutos só baixando fontes, antes de qualquer teste). 10 min de folga.
      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium
        timeout-minutes: 10

      - name: Testes de navegador (build + emuladores)
        run: npm run e2e
        timeout-minutes: 12

      - name: Relatório dos testes de navegador (quando falham)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Inventário de vulnerabilidades nas dependências. INFORMATIVO — não
  # bloqueia o merge de propósito: hoje os achados são transitivos do lado
  # NODE do SDK Firebase (faye-websocket, grpc-js, protobufjs) e do
  # ferramental de build (postcss, nanoid), que não chegam ao bundle servido
  # ao navegador. Transformar em bloqueante exige antes resolver esses casos,
  # o que passa por atualizar o `firebase` — mudança de núcleo, que merece PR
  # próprio. Ver docs/20-SEGURANCA-E-PRIVACIDADE/10-SEGURANCA-TECNICA.md §11.
  dependencias:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
        timeout-minutes: 8
      - name: Vulnerabilidades que chegam ao usuário (produção)
        run: npm audit --omit=dev || true
      - name: Vulnerabilidades no ferramental (desenvolvimento)
        run: npm audit || true

  # Regra do projeto (CLAUDE.md §2.12): toda implementação atualiza a documentação.
  docs-obrigatorios:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Código mudou, documentação também?
        env:
          BASE_REF: origin/${{ github.base_ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-docs-updated.mjs
