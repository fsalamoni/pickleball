# Diagnóstico das REGRAS do Firestore: publica só as regras (compactadas) com
# `--debug` e mostra a resposta do serviço de regras. Existe porque a CLI
# esconde o erro real da publicação: quando o PATCH da release falha, ela tenta
# criar a release e sai com "409 already exists", sem dizer por que o PATCH
# falhou. Só à mão (workflow_dispatch). Publica as regras do ref escolhido.
name: Diagnóstico das regras do Firestore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regras:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      FIRESTORE_DATABASE_ID: pickleball
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Install Firebase CLI
        run: npm install -g firebase-tools@13
      - name: Write service account credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          SA_FILE="$RUNNER_TEMP/firebase-sa.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SA_FILE"
          jq -e . "$SA_FILE" >/dev/null
          echo "GOOGLE_APPLICATION_CREDENTIALS=$SA_FILE" >> "$GITHUB_ENV"
      - name: Compactar regras
        run: node scripts/firestore-rules-compactar.mjs --escrever
      - name: Publicar regras com --debug
        run: |
          set +e
          firebase deploy --only "firestore:rules,firestore:$FIRESTORE_DATABASE_ID" --project "$FIREBASE_PROJECT_ID" --non-interactive --debug > "$RUNNER_TEMP/deploy.log" 2>&1
          RC=$?
          # Só as linhas que falam da API de regras (sem o corpo da fonte, que é enorme).
          grep -iE "rules\]|releases|rulesets|status\]|Error|released rules|body\]" "$RUNNER_TEMP/deploy.log" | grep -v '"source"' | cut -c1-1500
          echo "exit=$RC"
          exit $RC
