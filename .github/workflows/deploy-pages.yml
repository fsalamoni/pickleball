name: Deploy GitHub Pages

# Desde 2026-11-05 o GitHub Pages publica SÓ um redirecionamento para o site
# oficial (https://picklerush.web.app), mantendo o caminho. Até então ele
# publicava uma CÓPIA COMPLETA do aplicativo a cada push em `main`, falando com
# o banco de produção, mas sem os cabeçalhos de segurança do `firebase.json`
# (nosniff, Permissions-Policy, CSP…) e fora do controle do PWA — uma segunda
# porta para a mesma plataforma, que ninguém usava de propósito. Mesma ideia do
# site `pickletour` (redirect-only). Para tirar o Pages do ar de vez: Settings →
# Pages → desligar, e então apagar este workflow.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/configure-pages@v5

      - name: Montar o redirecionamento
        run: |
          mkdir -p site
          cat > site/index.html <<'HTML'
          <!doctype html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8">
            <meta name="robots" content="noindex">
            <title>PickleRush</title>
            <link rel="canonical" href="https://picklerush.web.app/">
            <script>
              var p = location.pathname.replace(/^\/pickleball/, '') || '/';
              location.replace('https://picklerush.web.app' + p + location.search + location.hash);
            </script>
            <meta http-equiv="refresh" content="0; url=https://picklerush.web.app/">
          </head>
          <body><p>O PickleRush mudou para <a href="https://picklerush.web.app/">picklerush.web.app</a>.</p></body>
          </html>
          HTML
          cp site/index.html site/404.html
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
